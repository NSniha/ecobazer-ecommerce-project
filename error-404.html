<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- ======== Primary Meta Tags ======== -->
        <title>Page Not Found – Ecobazar Online Grocery Store</title>
        <meta name="description" content="The page you’re looking for can’t be found on Ecobazar. Go back to the homepage and continue shopping fresh groceries and daily essentials.">
        
        <!-- 404 pages are usually not indexed -->
        <meta name="robots" content="noindex, nofollow">
        <meta name="author" content="Ecobazar">

        <!-- ======== Canonical URL ======== -->
        <link rel="canonical" href="https://www.ecobazar.com/404.html">

        <!-- ======== Favicon ======== -->
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">

        <!-- ======== Open Graph / Facebook ======== -->
        <meta property="og:title" content="Page Not Found – Ecobazar">
        <meta property="og:description" content="Oops! This Ecobazar page doesn’t exist. Head back to the homepage to continue shopping fresh groceries.">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://www.ecobazar.com/404.html">
        <meta property="og:image" content="images/og-ecobazar.jpg">

        <!-- ======== Twitter Card ======== -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Page Not Found – Ecobazar">
        <meta name="twitter:description" content="The page you requested can’t be found on Ecobazar. Return to the homepage and keep shopping.">
        <meta name="twitter:image" content="images/og-ecobazar.jpg">

        <!-- ========== Custom CSS =========== -->
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/error.css">

        <!-- ========== Google Fonts =========== -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>

    <body>
        <!-- ====================== 404 ERROR SECTION START ====================== -->
        <section class="er404-section">
            <div class="container">
                <div class="er404-wrapper">
                    <div class="er404-graphic">
                        <img src="images/404-illustration.png"
                            alt="Ecobazar 404 page not found illustration">
                    </div>

                    <h1 class="er404-title">Oops! This page can’t be found</h1>

                    <p class="er404-text">
                       The page you’re looking for doesn’t exist. Use the button below to return to the Ecobazar homepage and keep shopping.
                    </p>

                    <a href="index.html" class="er404-btn">Back to Home</a>
                </div>
            </div>
        </section>
        <!-- ====================== 404 ERROR SECTION END ====================== -->


        <!-- ================= SCRIPT ============== -->
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    </body>
</html>
